Vision Glass Dark:
  # --- Card-Mod Global Enhancements ---
  card-mod-theme: "Vision Glass Dark"
  card-mod-root: |
    app-header, .header, ha-top-app-bar-fixed {
      background: rgba(15, 23, 42, 0.80) !important;
      backdrop-filter: blur(28px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
    }
    ha-app-layout::before {
      content: "" !important;
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
      z-index: 0 !important;
      opacity: 0.40 !important;
      background:
        radial-gradient(circle at 20% 25%, rgba(14, 165, 233, 0.40) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(99, 102, 241, 0.35) 0%, transparent 48%),
        radial-gradient(circle at 70% 20%, rgba(16, 185, 129, 0.30) 0%, transparent 42%),
        radial-gradient(circle at 25% 80%, rgba(245, 158, 11, 0.25) 0%, transparent 42%) !important;
      filter: blur(90px) !important;
      animation: ambientThemeWaftDark 28s ease-in-out infinite alternate !important;
    }
    @keyframes ambientThemeWaftDark {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(50px, -40px, 0) scale(1.20) rotate(22deg);
      }
      100% {
        transform: translate3d(-45px, 45px, 0) scale(0.92) rotate(-22deg);
      }
    }
  card-mod-sidebar: |
    :host {
      background: rgba(15, 23, 42, 0.80) !important;
      backdrop-filter: blur(30px) saturate(190%) !important;
