      # --- Header & Navigation (Frosted Glass with Blur) ---
      app-header-background-color: 'rgba(238, 246, 255, 0.85)'
      app-header-backdrop-filter: 'blur(28px) saturate(190%)'
      app-header-text-color: '#0f172a'
      app-header-selection-bar-color: '#0284c7'
      app-header-border-bottom: '1px solid rgba(255, 255, 255, 0.85)'
      sidebar-background-color: 'rgba(238, 246, 255, 0.85)'
      sidebar-backdrop-filter: 'blur(30px) saturate(190%)'
      sidebar-text-color: '#0f172a'
      sidebar-selected-text-color: '#0284c7'
      sidebar-selected-icon-color: '#0284c7'
      sidebar-icon-color: '#475569'
      ha-sidebar-background: 'rgba(238, 246, 255, 0.85)'
      ha-sidebar-text-color: '#0f172a'
      ha-sidebar-icon-color: '#475569'
      ha-sidebar-selected-background: 'rgba(2, 132, 199, 0.16)'
      ha-sidebar-selected-text-color: '#0284c7'
      ha-sidebar-selected-icon-color: '#0284c7'
      ha-sidebar-divider-color: 'rgba(203, 213, 225, 0.60)'
      ha-color-text-primary: '#0f172a'
      ha-color-text-secondary: '#475569'
      wa-color-text-normal: '#0f172a'
      wa-color-text-quiet: '#475569'
