      ha-color-surface-container-lowest: '#ffffff'
      ha-color-surface-container-high: '#e8f0fe'
      ha-color-surface-container-highest: '#dbeafe'
      mdc-theme-background: '#eef5ff'
      mdc-theme-surface: '#ffffff'
      mdc-theme-on-surface: '#0f172a'
      mdc-theme-text-primary-on-background: '#0f172a'
