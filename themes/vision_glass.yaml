# ==============================================================================
# Vision Glass Theme for Home Assistant
# Translucent Glassmorphism inspired by Apple VisionOS & macOS
# Author: Adromir (https://github.com/adromir)
# Repository: https://github.com/adromir/ha-vision-glass-theme
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Vision Glass (Auto Switching via Home Assistant modes)
# ------------------------------------------------------------------------------
Vision Glass:
  # --- Card-Mod Global Enhancements ---
  card-mod-theme: "Vision Glass"
  card-mod-root: |
    app-header, .header, ha-top-app-bar-fixed {
      background: var(--app-header-background-color, rgba(238, 246, 255, 0.85)) !important;
      backdrop-filter: var(--app-header-backdrop-filter, blur(28px) saturate(190%)) !important;
      -webkit-backdrop-filter: var(--app-header-backdrop-filter, blur(28px) saturate(190%)) !important;
      border-bottom: 1px solid var(--divider-color, rgba(255, 255, 255, 0.20)) !important;
    }
    ha-app-layout::before {
      content: "" !important;
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
      z-index: 0 !important;
      opacity: 0.38 !important;
      background:
        radial-gradient(circle at 20% 25%, rgba(56, 189, 248, 0.40) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(99, 102, 241, 0.35) 0%, transparent 48%),
        radial-gradient(circle at 72% 20%, rgba(16, 185, 129, 0.30) 0%, transparent 42%),
        radial-gradient(circle at 22% 80%, rgba(245, 158, 11, 0.25) 0%, transparent 42%) !important;
      filter: blur(85px) !important;
      animation: ambientThemeWaft 30s ease-in-out infinite alternate !important;
    }
    @keyframes ambientThemeWaft {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate3d(50px, -35px, 0) scale(1.18) rotate(20deg);
      }
      100% {
        transform: translate3d(-40px, 45px, 0) scale(0.94) rotate(-20deg);
      }
    }
  card-mod-sidebar: |
    :host {
      background: var(--sidebar-background-color) !important;
      backdrop-filter: var(--sidebar-backdrop-filter, blur(30px) saturate(190%)) !important;
      -webkit-backdrop-filter: var(--sidebar-backdrop-filter, blur(30px) saturate(190%)) !important;
      border-right: 1px solid var(--divider-color, rgba(255, 255, 255, 0.15)) !important;
    }
    .menu {
      border-bottom: 1px solid var(--divider-color, rgba(255, 255, 255, 0.15)) !important;
    }
    paper-listbox {
      background: transparent !important;
    }
    paper-icon-item {
      border-radius: 14px !important;
      margin: 3px 8px !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    paper-icon-item:hover {
      background: rgba(255, 255, 255, 0.12) !important;
    }
    paper-icon-item.iron-selected {
      background: rgba(2, 132, 199, 0.18) !important;
      border: 1px solid rgba(2, 132, 199, 0.35) !important;
      backdrop-filter: blur(10px) !important;
    }
  card-mod-more-info: |
    ha-dialog {
      --mdc-dialog-box-shadow: 0 25px 60px rgba(0, 0, 0, 0.50) !important;
      --ha-dialog-border-radius: 28px !important;
    }
    ha-dialog .content, ha-dialog-surface {
      border-radius: 28px !important;
      backdrop-filter: blur(35px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(35px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.20) !important;
    }
  card-mod-card: |
    ha-card {
      border-radius: 22px !important;
      backdrop-filter: blur(25px) saturate(170%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(170%) !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    @media (prefers-color-scheme: light) {
      ha-card {
        background: rgba(255, 255, 255, 0.65) !important;
        border: 1px solid rgba(255, 255, 255, 0.90) !important;
        box-shadow: 0 10px 30px rgba(31, 38, 135, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.95) !important;
      }
      ha-card:hover {
        box-shadow: 0 14px 40px rgba(31, 38, 135, 0.14), inset 0 1px 1px rgba(255, 255, 255, 1) !important;
      }
    }
    @media (prefers-color-scheme: dark) {
      ha-card {
        background: rgba(24, 32, 48, 0.70) !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.15) !important;
      }
      ha-card:hover {
        border-color: rgba(56, 189, 248, 0.35) !important;
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55), 0 0 20px rgba(56, 189, 248, 0.15) !important;
      }
    }

  modes:
    light:
      # --- Backgrounds ---
      lovelace-background: 'radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.95) 0%, transparent 45%), radial-gradient(circle at 85% 80%, rgba(186, 230, 253, 0.65) 0%, transparent 50%), linear-gradient(135deg, #cbe3f7 0%, #dbeafe 30%, #eef5ff 65%, #cde2f8 100%) fixed'
      primary-background-color: '#d0e1f3'
      secondary-background-color: 'rgba(255, 255, 255, 0.50)'
      card-background-color: 'rgba(255, 255, 255, 0.65)'

      # --- Card Glassmorphism ---
      ha-card-background: 'rgba(255, 255, 255, 0.65)'
      ha-card-backdrop-filter: 'blur(25px) saturate(180%)'
      ha-card-border-radius: '22px'
      ha-card-border-width: '1px'
      ha-card-border-color: 'rgba(255, 255, 255, 0.90)'
      ha-card-box-shadow: '0 10px 30px rgba(31, 38, 135, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.95)'

      # --- Typography ---
      primary-text-color: '#0f172a'
      secondary-text-color: '#475569'
      text-primary-color: '#0f172a'
      disabled-text-color: 'rgba(15, 23, 42, 0.38)'
