      # --- Typography ---
      primary-text-color: '#f8fafc'
      secondary-text-color: '#94a3b8'
      text-primary-color: '#f8fafc'
      disabled-text-color: 'rgba(248, 250, 252, 0.38)'
      divider-color: 'rgba(255, 255, 255, 0.10)'

      # --- Accents & States ---
      primary-color: '#38bdf8'
      accent-color: '#f59e0b'
      state-icon-color: '#94a3b8'
      state-icon-active-color: '#38bdf8'
      state-active-color: '#38bdf8'
      state-inactive-color: '#64748b'

      # --- Forms, Dropdowns, Inputs ---
      ha-color-form-background: 'rgba(255, 255, 255, 0.08)'
      ha-color-form-background-hover: 'rgba(255, 255, 255, 0.14)'
      ha-color-form-background-disabled: 'rgba(255, 255, 255, 0.04)'
      input-fill-color: 'rgba(255, 255, 255, 0.08)'
      input-ink-color: '#f8fafc'
      input-label-ink-color: '#94a3b8'
      input-disabled-fill-color: 'rgba(255, 255, 255, 0.04)'
      input-disabled-ink-color: 'rgba(248, 250, 252, 0.38)'
      input-idle-line-color: 'transparent'
      input-hover-line-color: '#38bdf8'
      input-dropdown-icon-color: '#94a3b8'
      mdc-text-field-fill-color: 'rgba(255, 255, 255, 0.08)'
